[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]
# The app embeds its built frontend (app/dist), so plain `cargo` commands leave it out.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# `"*"` leaves out workspace members; unoptimised, the solver runs tens of times slower
# (`tauri dev` builds this profile).
[profile.dev.package.exhaust-core]
opt-level = 3
