[package]
name = "exhaust-core"
description = "Exhaust gas-dynamics and acoustics solver core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
hound = "3.5.1"
nalgebra = "0.35.0"
rayon = "1.12.0"
rustfft = "6.4.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", default-features = false, features = ["caf", "pcm", "alac", "aac"] }
thiserror = "2.0.21"
toml = "1.1.6"
truck-modeling = "0.6"
truck-stepio = { version = "0.3", default-features = false }

[dev-dependencies]
# Reads exported STEP back in the tests.
ruststep = "0.4"
truck-stepio = "0.3"
