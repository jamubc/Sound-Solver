[package]
name = "exhaust-jobs"
description = "Jobs for exhaust-core: specs, cache and backends"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
exhaust-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
# Exact float parsing: a cached result equals a fresh one to the bit.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
