[package]
name = "exhaust-app"
description = "Desktop shell over exhaust-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "exhaust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
exhaust-core = { path = "../../crates/core" }
exhaust-jobs = { path = "../../crates/jobs" }
rayon = "1.12.0"
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
