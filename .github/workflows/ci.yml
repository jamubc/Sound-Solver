name: ci

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit and integration tests
        run: cargo test
      - name: Analytic validation suite
        run: cargo run --release -p exhaustctl -- validate

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Frontend types match the schemas
        run: npm run types && git diff --exit-code src/lib/types
      - name: Type check
        run: npm run check
      - name: Build the frontend
        run: npm run build
      - name: Backend tests
        run: cargo test -p exhaust-app
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps webkit
          npm run fixtures
          npm run test:e2e
